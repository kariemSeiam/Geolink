<svg width="1600" height="360" viewBox="0 0 1600 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7E67" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF7E67" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#1A5F7A"/>
    </linearGradient>
  </defs>

  <circle cx="800" cy="180" r="70" fill="url(#glow)"/>

  <circle cx="800" cy="180" r="10" fill="none" stroke="url(#ringStroke)" stroke-width="2.5">
    <animate attributeName="r" values="10;150" dur="3s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <circle cx="800" cy="180" r="10" fill="none" stroke="url(#ringStroke)" stroke-width="2.5">
    <animate attributeName="r" values="10;150" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <circle cx="800" cy="180" r="10" fill="none" stroke="url(#ringStroke)" stroke-width="2.5">
    <animate attributeName="r" values="10;150" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#00B4D8" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="800" y1="90" x2="800" y2="115"/>
    <line x1="800" y1="245" x2="800" y2="270"/>
    <line x1="710" y1="180" x2="735" y2="180"/>
    <line x1="865" y1="180" x2="890" y2="180"/>
  </g>

  <circle cx="800" cy="180" r="9" fill="#FF7E67"/>
  <circle cx="800" cy="180" r="9" fill="none" stroke="#F8FAFC" stroke-width="2"/>
</svg>
